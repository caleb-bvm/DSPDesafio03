<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1040" width="1600" height="1040" font-family="'Segoe UI', Arial, Helvetica, sans-serif">
<title>Arquitectura del sistema de préstamo de equipos de laboratorio</title>
<defs><marker id="p-1d4ed8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d4ed8"/></marker><marker id="p-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker><marker id="p-15803d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#15803d"/></marker><marker id="p-7b8794" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7b8794"/></marker></defs>
<rect width="1600" height="1040" fill="#ffffff"/><text x="40" y="56" font-size="30" fill="#1f2933" font-weight="600">Sistema de préstamo de equipos de laboratorio</text><text x="40" y="86" font-size="16" fill="#52606d">Arquitectura de la solución · ASP.NET Core 10 · tres proyectos y una base de datos compartida</text><rect x="320" y="118" width="1250" height="792" rx="14" fill="none" stroke="#cbd2d9" stroke-width="1.5" stroke-dasharray="8 6"/><text x="340" y="146" font-size="13" fill="#52606d">Docker Compose (opción A): red interna, puertos del host 5101–5103 → 8080 y 14330 → 1433. Opción B: los mismos procesos en el equipo, con SQL Server Express.</text><rect x="40" y="170" width="170" height="720" rx="10" fill="#f5f7fa" stroke="#cbd2d9" stroke-width="1.5"/><text x="125" y="206" font-size="20" fill="#1f2933" font-weight="600" text-anchor="middle">Navegador</text><text x="125" y="228" font-size="13" fill="#52606d" text-anchor="middle">Usuarios por rol</text><rect x="54" y="262" width="142" height="90" rx="6" fill="#ffffff" stroke="#cbd2d9"/><text x="125" y="288" font-size="14" fill="#1f2933" font-weight="600" text-anchor="middle">Admin</text><text x="125" y="312" font-size="11.5" fill="#52606d" text-anchor="middle">Mantiene catálogos</text><text x="125" y="330" font-size="11.5" fill="#52606d" text-anchor="middle">y usuarios; ve reportes</text><rect x="54" y="366" width="142" height="90" rx="6" fill="#ffffff" stroke="#cbd2d9"/><text x="125" y="392" font-size="14" fill="#1f2933" font-weight="600" text-anchor="middle">Docente</text><text x="125" y="416" font-size="11.5" fill="#52606d" text-anchor="middle">Presta, recibe</text><text x="125" y="434" font-size="11.5" fill="#52606d" text-anchor="middle">y ve todos los préstamos</text><rect x="54" y="470" width="142" height="90" rx="6" fill="#ffffff" stroke="#cbd2d9"/><text x="125" y="496" font-size="14" fill="#1f2933" font-weight="600" text-anchor="middle">Estudiante</text><text x="125" y="520" font-size="11.5" fill="#52606d" text-anchor="middle">Ve equipos disponibles</text><text x="125" y="538" font-size="11.5" fill="#52606d" text-anchor="middle">y sus propios préstamos</text><rect x="350" y="170" width="370" height="390" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/><rect x="350" y="170" width="370" height="6" rx="3" fill="#0f766e"/><text x="370" y="204" font-size="20" fill="#0f766e" font-weight="600">EquiposMVC</text><text x="370" y="224" font-size="13" fill="#52606d">Interfaz de operación · http://localhost:5102</text><rect x="366" y="240" width="338" height="54" rx="6" fill="#f5f7fa"/><text x="378" y="261" font-size="13" fill="#1f2933" font-weight="600">Controllers + vistas Razor</text><text x="378" y="280" font-size="13" fill="#52606d">Equipo, Categoria, Prestamo, Auth, Home</text><rect x="366" y="302" width="338" height="54" rx="6" fill="#f5f7fa"/><text x="378" y="323" font-size="13" fill="#1f2933" font-weight="600">Services (un HttpClient por servicio)</text><text x="378" y="342" font-size="13" fill="#52606d">Auth, Categoria, Equipo y Prestamo</text><rect x="366" y="364" width="338" height="54" rx="6" fill="#f5f7fa"/><text x="378" y="385" font-size="13" fill="#1f2933" font-weight="600">ApiTokenHandler</text><text x="378" y="404" font-size="13" fill="#52606d">Agrega Authorization: Bearer a cada petición</text><rect x="366" y="426" width="338" height="54" rx="6" fill="#f5f7fa"/><text x="378" y="447" font-size="13" fill="#1f2933" font-weight="600">Session (2 horas de inactividad)</text><text x="378" y="466" font-size="13" fill="#52606d">Guarda token, rol y username en el servidor</text><rect x="366" y="488" width="338" height="54" rx="6" fill="#f5f7fa"/><text x="378" y="509" font-size="13" fill="#1f2933" font-weight="600">Sin acceso a datos</text><text x="378" y="528" font-size="13" fill="#52606d">No tiene DbContext ni cadena de conexión</text><rect x="350" y="640" width="370" height="250" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/><rect x="350" y="640" width="370" height="6" rx="3" fill="#7c3aed"/><text x="370" y="674" font-size="20" fill="#7c3aed" font-weight="600">EquiposReportes</text><text x="370" y="694" font-size="13" fill="#52606d">Reportes solo para Admin · http://localhost:5103</text><rect x="366" y="708" width="338" height="52" rx="6" fill="#f5f7fa"/><text x="378" y="729" font-size="13" fill="#1f2933" font-weight="600">ReportesController [Authorize Admin]</text><text x="378" y="748" font-size="13" fill="#52606d">Inventario, Vencidos, Top 5 e Historial</text><rect x="366" y="766" width="338" height="52" rx="6" fill="#f5f7fa"/><text x="378" y="787" font-size="13" fill="#1f2933" font-weight="600">CuentaController + cookie</text><text x="378" y="806" font-size="13" fill="#52606d">Valida en la API; sin usuarios propios</text><rect x="366" y="824" width="338" height="52" rx="6" fill="#f5f7fa"/><text x="378" y="845" font-size="13" fill="#1f2933" font-weight="600">ReportesService + EF Core (BD primero)</text><text x="378" y="864" font-size="13" fill="#52606d">Consultas con Scaffold-DbContext</text><rect x="820" y="170" width="370" height="390" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/><rect x="820" y="170" width="370" height="6" rx="3" fill="#1d4ed8"/><text x="840" y="204" font-size="20" fill="#1d4ed8" font-weight="600">EquiposAPI</text><text x="840" y="224" font-size="13" fill="#52606d">Reglas de negocio · http://localhost:5101</text><rect x="836" y="240" width="338" height="54" rx="6" fill="#f5f7fa"/><text x="848" y="261" font-size="13" fill="#1f2933" font-weight="600">JwtBearer + [Authorize(Roles)]</text><text x="848" y="280" font-size="13" fill="#52606d">Token de 60 minutos, sin tolerancia de reloj</text><rect x="836" y="302" width="338" height="54" rx="6" fill="#f5f7fa"/><text x="848" y="323" font-size="13" fill="#1f2933" font-weight="600">Controllers REST /api</text><text x="848" y="342" font-size="13" fill="#52606d">auth, categorias, equipos, prestamos, usuarios</text><rect x="836" y="364" width="338" height="54" rx="6" fill="#f5f7fa"/><text x="848" y="385" font-size="13" fill="#1f2933" font-weight="600">Servicios</text><text x="848" y="404" font-size="13" fill="#52606d">TokenService, PasswordHasher, AutoMapper</text><rect x="836" y="426" width="338" height="54" rx="6" fill="#f5f7fa"/><text x="848" y="447" font-size="13" fill="#1f2933" font-weight="600">EF Core (código primero)</text><text x="848" y="466" font-size="13" fill="#52606d">EquiposDbContext y migraciones</text><rect x="836" y="488" width="338" height="54" rx="6" fill="#f5f7fa"/><text x="848" y="509" font-size="13" fill="#1f2933" font-weight="600">Arranque y herramientas</text><text x="848" y="528" font-size="13" fill="#52606d">AdminSeeder; Swagger en Development</text><path d="M1290 186V874a130 16 0 0 0 260 0V186" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/><ellipse cx="1420" cy="186" rx="130" ry="16" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><text x="1420" y="236" font-size="20" fill="#b45309" font-weight="600" text-anchor="middle">SQL Server</text><text x="1420" y="258" font-size="13" fill="#52606d" text-anchor="middle">Base EquiposDb</text><rect x="1306" y="278" width="228" height="54" rx="6" fill="#f5f7fa"/><text x="1318" y="299" font-size="13" fill="#1f2933" font-weight="600">Categorias</text><text x="1318" y="318" font-size="13" fill="#52606d">Nombre único</text><rect x="1306" y="340" width="228" height="54" rx="6" fill="#f5f7fa"/><text x="1318" y="361" font-size="13" fill="#1f2933" font-weight="600">Equipos</text><text x="1318" y="380" font-size="13" fill="#52606d">FK a Categorias; rowversion</text><rect x="1306" y="402" width="228" height="54" rx="6" fill="#f5f7fa"/><text x="1318" y="423" font-size="13" fill="#1f2933" font-weight="600">Usuarios</text><text x="1318" y="442" font-size="13" fill="#52606d">Username único; hash; rol</text><rect x="1306" y="464" width="228" height="54" rx="6" fill="#f5f7fa"/><text x="1318" y="485" font-size="13" fill="#1f2933" font-weight="600">Prestamos</text><text x="1318" y="504" font-size="13" fill="#52606d">FK a Equipos y Usuarios</text><text x="1306" y="546" font-size="13" fill="#1f2933" font-weight="600">Restricciones</text><text x="1306" y="570" font-size="13" fill="#52606d">CHECK de Estado y Rol</text><text x="1306" y="590" font-size="13" fill="#52606d">Un préstamo activo por equipo</text><text x="1306" y="610" font-size="13" fill="#52606d">(índice único filtrado)</text><text x="1306" y="630" font-size="13" fill="#52606d">FK sin borrado en cascada</text><text x="1306" y="680" font-size="13" fill="#1f2933" font-weight="600">Logins</text><text x="1306" y="704" font-size="13" fill="#52606d">API: sa (Docker) o Windows (local)</text><text x="1306" y="724" font-size="13" fill="#52606d">Reportes: reportes,</text><text x="1306" y="744" font-size="13" fill="#52606d">solo db_datareader</text><text x="1306" y="790" font-size="13" fill="#1f2933" font-weight="600">Inicialización</text><text x="1306" y="814" font-size="13" fill="#52606d">La API aplica migraciones;</text><text x="1306" y="834" font-size="13" fill="#52606d">db-init crea el login reportes</text><path d="M210 365H348" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#p-1d4ed8)" /><text x="265" y="355" font-size="12" fill="#1d4ed8" text-anchor="middle">HTML por HTTP</text><text x="265" y="383" font-size="12" fill="#52606d" text-anchor="middle">cookie de sesión</text><path d="M210 765H348" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#p-1d4ed8)" /><text x="265" y="755" font-size="12" fill="#1d4ed8" text-anchor="middle">HTML por HTTP</text><text x="265" y="783" font-size="12" fill="#52606d" text-anchor="middle">cookie de auth</text><path d="M720 365H818" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#p-1d4ed8)" /><text x="770" y="355" font-size="12" fill="#1d4ed8" text-anchor="middle">REST + JSON</text><text x="770" y="383" font-size="12" fill="#52606d" text-anchor="middle">Bearer JWT</text><path d="M1190 365H1288" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#p-b45309)" /><text x="1240" y="355" font-size="12" fill="#b45309" text-anchor="middle">EF Core</text><text x="1240" y="383" font-size="12" fill="#52606d" text-anchor="middle">lee y escribe</text><path d="M720 700H1005V562" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#p-1d4ed8)" /><text x="740" y="690" font-size="12" fill="#1d4ed8">POST /api/auth/login</text><text x="740" y="720" font-size="12" fill="#52606d">Si el rol no es Admin, se rechaza</text><path d="M720 820H1288" fill="none" stroke="#15803d" stroke-width="2" marker-end="url(#p-15803d)" /><text x="1005" y="810" font-size="12" fill="#15803d" text-anchor="middle">EF Core · usuario SQL reportes</text><text x="1005" y="838" font-size="12" fill="#52606d" text-anchor="middle">solo lectura (db_datareader)</text><path d="M535 562V638" fill="none" stroke="#7b8794" stroke-width="2" stroke-dasharray="6 5" marker-start="url(#p-7b8794)" marker-end="url(#p-7b8794)"/><text x="548" y="596" font-size="12" fill="#52606d">Enlaces entre aplicaciones;</text><text x="548" y="613" font-size="12" fill="#52606d">Reportes pide login otra vez</text><text x="40" y="948" font-size="14" fill="#1f2933" font-weight="600">Conexiones</text><path d="M40 970H80" stroke="#1d4ed8" stroke-width="2" /><text x="90" y="975" font-size="13" fill="#1f2933">Petición HTTP</text><path d="M40 996H80" stroke="#b45309" stroke-width="2" /><text x="90" y="1001" font-size="13" fill="#1f2933">SQL de lectura y escritura</text><path d="M290 970H330" stroke="#15803d" stroke-width="2" /><text x="340" y="975" font-size="13" fill="#1f2933">SQL de solo lectura</text><path d="M290 996H330" stroke="#7b8794" stroke-width="2" stroke-dasharray="6 5"/><text x="340" y="1001" font-size="13" fill="#1f2933">Navegación entre aplicaciones</text><text x="620" y="948" font-size="14" fill="#1f2933" font-weight="600">Reglas de la arquitectura</text><text x="620" y="974" font-size="13" fill="#1f2933">Solo EquiposAPI escribe en la base de datos.</text><text x="620" y="996" font-size="13" fill="#1f2933">EquiposMVC trabaja únicamente a través de la API.</text><text x="620" y="1018" font-size="13" fill="#1f2933">EquiposReportes lee la base directamente y valida el login en la API.</text><text x="1130" y="948" font-size="14" fill="#1f2933" font-weight="600">Secretos</text><text x="1130" y="974" font-size="13" fill="#1f2933">Opción A: archivo .env</text><text x="1130" y="996" font-size="13" fill="#1f2933">Opción B: User Secrets</text><text x="1130" y="1018" font-size="13" fill="#1f2933">Nunca en appsettings.json</text></svg>
