$kind: http-request
url: "{{baseUrl}}/api/equipos"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "codigoInventario": "{{codigoConcurrencia}}",
      "nombre": "Proyector de prueba",
      "descripcion": "Concurrencia",
      "categoriaId": {{categoriaId}},
      "estado": "Disponible"
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.set("codigoConcurrencia", "LAB-C-" + Date.now());
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Equipo creado", () => pm.expect(pm.response.code).to.be.oneOf([200, 201]));
      pm.collectionVariables.set("equipoConcurrenciaId", pm.response.json().id);
    language: text/javascript
order: 14000
