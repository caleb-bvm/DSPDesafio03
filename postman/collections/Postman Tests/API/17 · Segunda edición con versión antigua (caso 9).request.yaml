$kind: http-request
url: "{{baseUrl}}/api/equipos/{{equipoConcurrenciaId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "codigoInventario": "{{codigoConcurrencia}}",
      "nombre": "Cambio tardío",
      "descripcion": "Segunda edición",
      "categoriaId": {{categoriaId}},
      "estado": "Disponible",
      "rowVersion": "{{rowVersionAnterior}}"
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: pm.test("HTTP 409", () => pm.response.to.have.status(409));
    language: text/javascript
order: 17000
