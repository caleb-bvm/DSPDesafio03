$kind: http-request
url: "{{baseUrl}}/api/prestamos"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "equipoId": {{equipoPrestamoId}},
      "usuarioId": {{studentId}},
      "fechaVencimiento": "{{vencimiento3}}",
      "observaciones": "Debe fallar"
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: pm.test("HTTP 409", () => pm.response.to.have.status(409));
    language: text/javascript
order: 12000
