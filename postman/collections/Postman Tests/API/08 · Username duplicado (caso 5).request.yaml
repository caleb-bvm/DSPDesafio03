$kind: http-request
url: "{{baseUrl}}/api/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "{{studentUsername}}",
      "email": "{{studentEmail}}",
      "password": "{{studentPassword}}",
      "rol": "Estudiante"
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: pm.test("HTTP 409", () => pm.response.to.have.status(409));
    language: text/javascript
order: 8000
