$kind: http-request
url: "{{baseUrl}}/api/equipos"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "codigoInventario": "LAB-SIN-PERMISO",
      "nombre": "No autorizado",
      "descripcion": "Prueba de roles",
      "categoriaId": {{categoriaId}},
      "estado": "Disponible"
    }
auth:
  type: bearer
  credentials:
    token: "{{studentToken}}"
scripts:
  - type: afterResponse
    code: pm.test("HTTP 403", () => pm.response.to.have.status(403));
    language: text/javascript
order: 7000
