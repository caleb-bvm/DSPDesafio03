$kind: http-request
url: "{{baseUrl}}/api/equipos"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "codigoInventario": "{{codigoPrestamo}}",
      "nombre": "Laptop de prueba",
      "descripcion": "Caso de préstamo",
      "categoriaId": {{categoriaId}},
      "estado": "Disponible"
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.set("codigoPrestamo", "LAB-P-" + Date.now());
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Equipo creado", () => pm.expect(pm.response.code).to.be.oneOf([200, 201]));
      pm.collectionVariables.set("equipoPrestamoId", pm.response.json().id);
    language: text/javascript
order: 9000
