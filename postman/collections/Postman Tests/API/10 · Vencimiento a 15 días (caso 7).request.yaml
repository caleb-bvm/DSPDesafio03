$kind: http-request
url: "{{baseUrl}}/api/prestamos"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "equipoId": {{equipoPrestamoId}},
      "usuarioId": {{studentId}},
      "fechaVencimiento": "{{vencimiento15}}",
      "observaciones": "Debe fallar"
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: beforeRequest
    code: |-
      const d = new Date();
      d.setDate(d.getDate() + 15);
      pm.collectionVariables.set("vencimiento15", d.toISOString());
    language: text/javascript
  - type: afterResponse
    code: pm.test("HTTP 400", () => pm.response.to.have.status(400));
    language: text/javascript
order: 10000
