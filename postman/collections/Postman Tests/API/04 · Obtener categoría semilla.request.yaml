$kind: http-request
url: "{{baseUrl}}/api/categorias"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", () => pm.response.to.have.status(200));
      const categorias = pm.response.json();
      pm.test("Hay categorías", () => pm.expect(categorias.length).to.be.above(0));
      pm.collectionVariables.set("categoriaId", categorias[0].id);
    language: text/javascript
order: 4000
